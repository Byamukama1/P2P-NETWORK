<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>GreenLeaf Dispensary</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDDY0Qk5Og1eEslvUXo8yQiOVA_PQ3qa5s",
      authDomain: "p2p-network-d08c5.firebaseapp.com",
      projectId: "p2p-network-d08c5",
      storageBucket: "p2p-network-d08c5.firebasestorage.app",
      messagingSenderId: "278654560881",
      appId: "1:278654560881:web:f7bfb4a06fd5e969cc89d0",
      measurementId: "G-DECS8Q4BG8"
    };
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    console.log("Firebase initialized", app);
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f4f7f2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 12px 80px 12px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 12px 30px rgba(0, 30, 0, 0.08);
      overflow: hidden;
      padding: 20px 18px 30px 18px;
      position: relative;
    }

    /* ---- Logo area ---- */
    .logo-section {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .logo-section img {
      max-width: 100%;
      height: auto;
      border-radius: 20px;
      background: #eaf3e4;
      padding: 8px 16px;
      box-shadow: 0 4px 10px rgba(0, 40, 0, 0.04);
    }

    /* ---- Location map link ---- */
    .location-card {
      background: #eef6ea;
      border-radius: 60px;
      padding: 10px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #cde0c2;
      transition: 0.2s;
    }
    .location-card:hover {
      background: #e2f0da;
      border-color: #9fbf8a;
    }
    .location-card a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #1f4f1f;
      font-weight: 500;
      font-size: 0.95rem;
      width: 100%;
    }
    .location-card i {
      font-size: 1.2rem;
      color: #2d6a2d;
    }
    .location-card span {
      background: #2d6a2d;
      color: white;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* ---- Section title ---- */
    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1b3b1b;
      margin: 24px 0 12px 0;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title i {
      color: #3d7a3d;
      font-size: 1.2rem;
    }

    /* ---- Package cards ---- */
    .packages-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
    }

    .package-card {
      background: white;
      border-radius: 24px;
      padding: 16px 16px 18px 16px;
      box-shadow: 0 4px 14px rgba(0, 30, 0, 0.04);
      border: 1px solid #e2efe0;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
    }
    .package-card:hover {
      border-color: #9ac18a;
      box-shadow: 0 8px 20px rgba(60, 110, 40, 0.08);
    }

    .package-image {
      width: 100%;
      height: 140px;
      background: #e4efe0;
      border-radius: 20px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #2d5a2d;
      font-weight: 500;
      font-size: 0.9rem;
      position: relative;
    }
    .package-image i {
      font-size: 2.8rem;
      opacity: 0.5;
      color: #3a6b3a;
    }
    /* Different background colors to simulate cannabis package images */
    .package-card:nth-child(1) .package-image { background-image: linear-gradient(145deg, #b9d7ae, #7ca56b); }
    .package-card:nth-child(2) .package-image { background-image: linear-gradient(145deg, #c7ddb0, #6f9a5a); }
    .package-card:nth-child(3) .package-image { background-image: linear-gradient(145deg, #b3ce9e, #5d8749); }
    .package-card:nth-child(4) .package-image { background-image: linear-gradient(145deg, #a8c492, #4f7a3b); }
    /* overlay text to indicate "package image" */
    .package-image .img-label {
      background: rgba(30, 50, 20, 0.5);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 40px;
      color: white;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .package-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 4px;
      margin-bottom: 14px;
    }
    .package-name {
      font-weight: 700;
      font-size: 1.15rem;
      color: #1d3a1d;
    }
    .package-weight {
      background: #eaf3e4;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #2f5a2f;
    }
    .package-price {
      font-weight: 700;
      font-size: 1.3rem;
      color: #1f4f1f;
      letter-spacing: -0.3px;
    }
    .package-price small {
      font-weight: 400;
      font-size: 0.8rem;
      color: #4b6e4b;
      margin-left: 2px;
    }

    .invest-btn {
      background: #1f4f1f;
      border: none;
      border-radius: 60px;
      padding: 14px 10px;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(30, 80, 30, 0.15);
      text-decoration: none;
      border: 1px solid #2d6a2d;
    }
    .invest-btn i {
      font-size: 1rem;
      transition: 0.2s;
    }
    .invest-btn:hover {
      background: #2d6a2d;
      transform: scale(1.01);
      box-shadow: 0 8px 16px rgba(30, 80, 30, 0.2);
    }
    .invest-btn:active {
      transform: scale(0.97);
    }

    /* ---- Bottom navigation ---- */
    .bottom-nav {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .nav-inner {
      background: #ffffffdd;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 60px;
      padding: 8px 10px;
      display: flex;
      gap: 4px;
      box-shadow: 0 8px 30px rgba(0, 20, 0, 0.12);
      border: 1px solid #dce8d6;
      pointer-events: auto;
      max-width: 380px;
      width: 100%;
      justify-content: space-around;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #3d5a3d;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 40px;
      transition: 0.2s;
      flex: 1;
      text-align: center;
      gap: 2px;
    }
    .nav-item i {
      font-size: 1.3rem;
      color: #3d6a3d;
    }
    .nav-item.active {
      background: #dcecd4;
      color: #1b451b;
    }
    .nav-item.active i {
      color: #1f4f1f;
    }
    .nav-item:hover {
      background: #e8f2e2;
    }

    /* small extra */
    .footer-note {
      margin-top: 12px;
      text-align: center;
      font-size: 0.7rem;
      color: #6b8a6b;
      letter-spacing: 0.3px;
    }

    /* responsive */
    @media (max-width: 460px) {
      .container { padding: 16px 12px 20px 12px; }
      .package-info { flex-direction: column; align-items: flex-start; }
      .package-price { align-self: flex-start; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Logo (from Cloudinary) -->
  <div class="logo-section">
    <img src="https://res.cloudinary.com/dp81zzxlh/image/upload/v1785751860/AM-CBD-Drops-Hybrid-Oil-30ml_bottle-syringe_h9g361.png" 
         alt="GreenLeaf logo - AM CBD Drops Hybrid Oil" 
         style="max-width: 100%; height: auto; width: 180px;">
  </div>

  <!-- Location link (Google Maps) -->
  <div class="location-card">
    <a href="https://maps.app.goo.gl/mhHXvWG2HuuupVK6A" target="_blank" rel="noopener noreferrer">
      <i class="fas fa-map-pin"></i>
      <span>📍 123 Green St, CA</span>
      <i class="fas fa-chevron-right" style="margin-left: auto; opacity: 0.6;"></i>
    </a>
  </div>

  <!-- Packages Section -->
  <div class="section-title">
    <i class="fas fa-seedling"></i> Premium Aurora
  </div>

  <div class="packages-grid">
    <!-- Package 1: 1g -->
    <div class="package-card">
      <div class="package-image">
        <span class="img-label"><i class="fas fa-cannabis"></i> 1g jar</span>
      </div>
      <div class="package-info">
        <span class="package-name">Aurora Indica</span>
        <span class="package-weight">1 g</span>
        <span class="package-price">$10 <small>/g</small></span>
      </div>
      <a href="invest.html" class="invest-btn" data-package="1g" data-price="10">
        <i class="fas fa-plus-circle"></i> Invest $10
      </a>
    </div>

    <!-- Package 2: 3.5g (1/8 oz) -->
    <div class="package-card">
      <div class="package-image">
        <span class="img-label"><i class="fas fa-cannabis"></i> 3.5g jar</span>
      </div>
      <div class="package-info">
        <span class="package-name">Aurora Sativa</span>
        <span class="package-weight">3.5 g</span>
        <span class="package-price">$35 <small>/8th</small></span>
      </div>
      <a href="invest.html" class="invest-btn" data-package="3.5g" data-price="35">
        <i class="fas fa-plus-circle"></i> Invest $35
      </a>
    </div>

    <!-- Package 3: 7g -->
    <div class="package-card">
      <div class="package-image">
        <span class="img-label"><i class="fas fa-cannabis"></i> 7g pouch</span>
      </div>
      <div class="package-info">
        <span class="package-name">Aurora Hybrid</span>
        <span class="package-weight">7 g</span>
        <span class="package-price">$70 <small>/quarter</small></span>
      </div>
      <a href="invest.html" class="invest-btn" data-package="7g" data-price="70">
        <i class="fas fa-plus-circle"></i> Invest $70
      </a>
    </div>

    <!-- Package 4: 14g (half ounce) -->
    <div class="package-card">
      <div class="package-image">
        <span class="img-label"><i class="fas fa-cannabis"></i> 14g bag</span>
      </div>
      <div class="package-info">
        <span class="package-name">Aurora CBD+</span>
        <span class="package-weight">14 g</span>
        <span class="package-price">$140 <small>/half</small></span>
      </div>
      <a href="invest.html" class="invest-btn" data-package="14g" data-price="140">
        <i class="fas fa-plus-circle"></i> Invest $140
      </a>
    </div>
  </div>

  <!-- small note -->
  <div class="footer-note">
    <i class="fas fa-leaf" style="margin-right: 6px;"></i> 1g Aurora = $10 · all prices in USD
  </div>
</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-item active">
      <i class="fas fa-home"></i> Home
    </a>
    <a href="invest.html" class="nav-item">
      <i class="fas fa-chart-line"></i> Invest
    </a>
    <a href="assets.html" class="nav-item">
      <i class="fas fa-coins"></i> Assets
    </a>
    <a href="account.html" class="nav-item">
      <i class="fas fa-user-circle"></i> Account
    </a>
  </div>
</div>

<!-- Optional: small script to log package selection and Firebase ready -->
<script>
  (function() {
    // Log that Firebase is initialized (imported via module)
    console.log('🌿 GreenLeaf page ready. Firebase initialized in module.');

    // Attach click listener to all invest buttons for tracking (optional)
    const investBtns = document.querySelectorAll('.invest-btn');
    investBtns.forEach(btn => {
      btn.addEventListener('click', function(e) {
        const pkg = this.getAttribute('data-package') || 'unknown';
        const price = this.getAttribute('data-price') || '0';
        console.log(`🔗 Invest button clicked: ${pkg} — $${price}`);
        // link will naturally redirect to invest.html
      });
    });

    // bottom nav active state (already set on Home)
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', function() {
        // just a visual feedback (active state will be handled by page load)
        // but we remove active from all and set on clicked
        navItems.forEach(n => n.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // location card click tracking
    const locCard = document.querySelector('.location-card a');
    if (locCard) {
      locCard.addEventListener('click', function() {
        console.log('📍 Location map link clicked: Google Maps');
      });
    }

  })();
</script>

<!-- 
  Firebase is already initialized in the module at the top.
  The credentials are used as provided.
-->
</body>
</html>
